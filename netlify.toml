[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# Projects list is the homepage for now — shows /projects.html's content
# at the root URL without an actual redirect (so the address bar stays
# clean), leaving /projects.html itself working too.
# (The demo map lives at recce.html rather than index.html deliberately —
# Netlify's link post-processing auto-rewrites any href="index.html" to "/",
# which would otherwise silently loop the project card back to this list.)
[[redirects]]
  from = "/"
  to = "/projects.html"
  status = 200
  force = true

# Friendly /api/* URLs that map onto the actual function files.
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[redirects]]
  from = "/api/locations"
  to = "/.netlify/functions/locations"
  status = 200

[[redirects]]
  from = "/api/photos"
  to = "/.netlify/functions/photos"
  status = 200

[[redirects]]
  from = "/api/photo"
  to = "/.netlify/functions/photo"
  status = 200

[[redirects]]
  from = "/api/board"
  to = "/.netlify/functions/board"
  status = 200

[[redirects]]
  from = "/api/folders"
  to = "/.netlify/functions/folders"
  status = 200

[[redirects]]
  from = "/api/cover"
  to = "/.netlify/functions/cover"
  status = 200
